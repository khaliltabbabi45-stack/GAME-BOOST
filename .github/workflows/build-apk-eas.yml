name: Build APK with EAS (optional, needs Expo account)

# Alternative to build-apk.yml. Requires:
#  1) an Expo account,
#  2) `npx eas-cli init` run once locally (adds extra.eas.projectId),
#  3) repository secret EXPO_TOKEN.

on:
  workflow_dispatch:

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait
