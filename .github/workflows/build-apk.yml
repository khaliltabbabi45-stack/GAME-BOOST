name: Build APK (no Expo account needed)

# Builds an installable Android APK directly on GitHub's runners.
# Run it from: Actions -> "Build APK (no Expo account needed)" -> Run workflow.
# The APK is attached to the run as an artifact named "gameboost-arena-apk".

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (informational)
        run: pnpm check
        continue-on-error: true

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gameboost-arena-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
